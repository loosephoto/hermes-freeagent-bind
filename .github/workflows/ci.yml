name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    # Windows ランナーの既定のコンソール符号化は cp1252 で、日本語の print が
    # UnicodeEncodeError になる（実測: ゲートが落ちた）。スクリプト側でも自己防衛しているが、
    # テストの失敗メッセージも日本語なのでジョブ全体で固定する。
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 実行時依存はゼロ。インストールは editable のみ（パッケージ解決が要るかどうかの検査も兼ねる）。
      - name: Install (no runtime dependencies)
        run: python -m pip install -e .

      - name: Compile
        run: python -m compileall -q src/freeagent_bind

      - name: Integrity (registry / schema / version)
        run: python scripts/check_integrity.py

      # ネットワークとモデルを使わない（プロキシも API キーも無い環境で通ることを保証する）。
      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -v

      # Issue #10: 生成した Linux systemd --user ユニットを実物の systemd-analyze で検査する。
      # 陽性対照（WorkingDirectory="..." が拒否されること）と、空白・% 入りパスの両方を確かめる。
      - name: Verify generated Linux systemd user units
        if: runner.os == 'Linux'
        run: |
          if command -v systemd-analyze >/dev/null 2>&1; then
            rt_dir="$(mktemp -d)"
            chmod 0700 "$rt_dir"
            work_root="$(mktemp -d)"
            bad_unit="$work_root/bad-quoted.service"
            printf '[Service]\nType=simple\nWorkingDirectory="/tmp"\nExecStart="%s" "-c" "pass"\n' "$(command -v python)" > "$bad_unit"
            if XDG_RUNTIME_DIR="$rt_dir" SYSTEMD_COLORS=0 systemd-analyze --user verify "$bad_unit" >/dev/null 2>&1; then
              echo "positive control failed: quoted WorkingDirectory was accepted"
              exit 1
            fi
            base_dir="$work_root/alice smith/job%2F1"
            mkdir -p "$base_dir/hermes-freeagent-bind/src/freeagent_bind"
            cp src/freeagent_bind/server.py "$base_dir/hermes-freeagent-bind/src/freeagent_bind/server.py"
            python scripts/install_resident.py \
              --platform linux \
              --hermes-home "$base_dir/.hermes" \
              --repo "$base_dir/hermes-freeagent-bind" \
              --unit-dir "$base_dir/units" \
              --python "$(command -v python)" \
              --write --force
            XDG_RUNTIME_DIR="$rt_dir" SYSTEMD_COLORS=0 systemd-analyze --user verify \
              "$base_dir/units/hermes-freeagent-bind.service" \
              "$base_dir/units/hermes-proxy.service"
            rm -rf "$rt_dir" "$work_root"
          fi

      - name: stdio smoke (real JSON-RPC path)
        run: python scripts/smoke_stdio.py

      # HTTP 経路（通知 202・batch・セッション・SSE・Origin/Host 検証）も同じ契約で守ること。
      # stdio だけ回すと HTTP 側の退行が見えない（実測: HTTP の Origin 検証が抜けていた）。
      - name: HTTP smoke (real StreamableHTTP path)
        run: python scripts/smoke_http.py

      # バックエンド全滅（死んだポート・キー無し）でも例外を漏らさず、ハングせず、状態を汚さないこと。
      - name: Offline degradation (no backend)
        run: python scripts/check_offline.py

      # 自発利用率の測定器が動くこと（state.db が無くても exit 2 で終わるだけ・副作用なし）。
      - name: Adoption meter runs
        run: python scripts/measure_adoption.py --sessions 5 || true

      # AGENTS.md のゲート一覧のうち、**ネットワークとモデルを要さないもの**を CI でも回す。
      # 例外は 2 つ（どちらもプロキシ / Free の枠が要るので CI では回さない）:
      #   `measure_quality.py`（正答率の測定）と `FREEAGENT_PROBE_NET=1 smoke_stdio.py`（モデル生存）。
      # apply_proactive は既定表示のみ（設定を書き換えない）ので副作用なし。
      - name: Proactive config check (no writes)
        run: python scripts/apply_proactive.py --check

      # 知识ソースの実 API 疎通（ネットワークあり・推論なし・キー不要のソースだけ）。
      # キー必須のソース（cinii / librariesio）は未設定なら**外して続行**する（未設定は失敗ではない）。
      # 実測: CI が回していないと、ソースの退行（URL 変更・応答形の変更）が誰も気づかない。
      # **openalex と ia は外す**: 前者は共有の日次予算切れ（"Insufficient budget … $0 remaining"）で
      # 後者は匿名枠の消費で**CI が不安定**になる（= 落ちると原因が掴めない）。どちらも
      # `scripts/measure_relevance.py`（記録する検証・失敗にはしない）で引き続き見る。
      - name: Knowledge probe (real API, stdio path)
        run: python scripts/probe_knowledge_stdio.py --sources wikipedia wikidata arxiv crossref github

      # 知識バックエンドの応答時間と関連性の測定器が動くこと（読むだけ・失敗にはしない）。
      - name: Knowledge meters run
        run: |
          python scripts/measure_kb.py --report || true
          python scripts/measure_relevance.py --report || true

      # モデルの生存確認の暖機（プロキシが無い環境では何もしない）。
      - name: Model warmup runs
        run: python scripts/warmup_models.py || true

  lint-encoding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ソースは UTF-8 で保存する（日本語 Windows で cp932 に落ちると応答が黙って捨てられる）。
      - name: Ensure UTF-8 sources
        run: |
          python - <<'PY'
          import pathlib, sys
          bad = []
          for path in list(pathlib.Path("src").rglob("*.py")) + list(pathlib.Path("tests").rglob("*.py")):
              data = path.read_bytes()
              try:
                  data.decode("utf-8")
              except UnicodeDecodeError as exc:
                  bad.append(f"{path}: {exc}")
              if data.startswith(b"\xef\xbb\xbf"):
                  bad.append(f"{path}: BOM 付き")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("UTF-8 OK")
          PY

  # macOS（launchd）常駐配線の実機検査（v0.51.0・SPEC §6.66）。
  # この経路は ubuntu / windows のランナーでは 1 行も実行されないため、plist を実物の `plutil` と
  # `launchctl` に通す（Linux 側の `systemd-analyze --user verify` と対になる検査）。
  macos-resident:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 既定の出力先（~/Library/LaunchAgents）へ生成する。launchctl は
      # 「ユーザー所有・group/world 書き込み不可」の plist しか受け付けないため、実運用と同じ場所に置く。
      - name: Generate launchd agents
        run: |
          python scripts/install_resident.py --platform macos \
            --hermes-home "$RUNNER_TEMP/fa-home" --repo "$GITHUB_WORKSPACE" \
            --python "$(command -v python3)" --write --force
          ls -l "$HOME/Library/LaunchAgents"

      # plistlib の round-trip は Python 内の話。launchd が受理する形かは plutil で見る。
      - name: plutil -lint both agents
        run: |
          plutil -lint "$HOME/Library/LaunchAgents/ai.hermes.freeagent-bind.plist"
          plutil -lint "$HOME/Library/LaunchAgents/ai.hermes.proxy.plist"

      # launchd は exec の前に StandardOutPath / StandardErrorPath / WorkingDirectory / 実行ファイルを開く。
      # どれか欠けると `last exit status = 78` で黙って終わる（bootstrap の rc は 0 のまま）ので、
      # 生成直後に同じ検査を通す。
      - name: Pre-flight what launchd checks before exec
        run: |
          python - <<'PY'
          import os, plistlib, sys
          unit_dir = os.path.expanduser("~/Library/LaunchAgents")
          bad = []
          names = ("ai.hermes.freeagent-bind.plist", "ai.hermes.proxy.plist")
          for name in names:
              with open(os.path.join(unit_dir, name), "rb") as fh:
                  plist = plistlib.load(fh)
              for key in ("StandardOutPath", "StandardErrorPath"):
                  parent = os.path.dirname(plist[key])
                  if not os.path.isdir(parent):
                      bad.append("%s: %s の親ディレクトリが無い: %s" % (name, key, parent))
              wd = plist.get("WorkingDirectory") or ""
              if not os.path.isdir(wd):
                  bad.append("%s: WorkingDirectory が無い: %s" % (name, wd))
              prog = plist["ProgramArguments"][0]
              if not os.path.isabs(prog):
                  bad.append("%s: ProgramArguments[0] が絶対パスではない: %s" % (name, prog))
              if prog != "/usr/bin/env" and not os.path.exists(prog):
                  bad.append("%s: 実行ファイルが無い: %s" % (name, prog))
          print("\n".join(bad) or "pre-flight OK")
          sys.exit(1 if bad else 0)
          PY

      # 実物の launchd へ登録し、`launchctl print` の state / last exit status で稼働を判定する
      # （これが無いと、起動していないエージェントを「登録成功」と報告してしまう）。
      - name: Bootstrap with real launchctl and verify state
        run: |
          if ! launchctl print "gui/$(id -u)" >/dev/null 2>&1; then
            echo "::warning::gui/$(id -u) ドメインに到達できないランナーのため launchd 登録は省略"
            exit 0
          fi
          python - <<'PY'
          import importlib.util, os, shutil
          spec = importlib.util.spec_from_file_location("ir", "scripts/install_resident.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          cfg = mod.build_config(
              os.path.join(os.environ["RUNNER_TEMP"], "fa-home"), os.getcwd(),
              "127.0.0.1", 8790, python=shutil.which("python3") or "",
              startup_dir=os.path.expanduser("~/Library/LaunchAgents"),
              platform_name="macos",
          )
          lines = mod.register_macos_agents(cfg)
          print("\n".join(lines))
          if any(line.startswith("service failed") for line in lines):
              raise SystemExit(1)
          PY
          launchctl print "gui/$(id -u)/ai.hermes.freeagent-bind" | grep -E 'state =|last exit status' || true
      - name: Bootout the agents
        if: always()
        run: |
          launchctl bootout "gui/$(id -u)/ai.hermes.freeagent-bind" 2>/dev/null || true
          launchctl bootout "gui/$(id -u)/ai.hermes.proxy" 2>/dev/null || true
